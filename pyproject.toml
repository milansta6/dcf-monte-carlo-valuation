[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dcf-valuation"
version = "1.0.0"
description = "DCF company valuation with Monte Carlo simulation - companion code to a master's thesis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Milan Stamenović" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
]
keywords = ["valuation", "discounted cash flow", "monte carlo", "corporate finance", "wacc"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Education",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5", "nbclient>=0.7", "nbformat>=5", "ipykernel"]
notebooks = ["jupyter"]
app = ["streamlit>=1.30"]

[project.scripts]
dcf-valuation = "dcf_valuation.cli:main"

[project.urls]
Repository = "https://github.com/milansta6/dcf-monte-carlo-valuation"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["thesis"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # en dashes and Serbian characters in text are intended

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402", "E501"]
